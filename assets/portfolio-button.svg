<svg xmlns="http://www.w3.org/2000/svg" width="260" height="56" viewBox="0 0 260 56">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#061010"/>
    </linearGradient>
    <style>
      @keyframes sweep {
        0%   { transform: translateX(-260px); }
        100% { transform: translateX(260px); }
      }
      .shine-bar {
        animation: sweep 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Rounded rectangle background -->
  <rect x="2" y="2" width="256" height="52" rx="12" ry="12"
        fill="url(#bg)" stroke="#010b15" stroke-width="1.5"/>

  <!-- Shine bar (the "magical" sweep) -->
  <rect class="shine-bar" x="0" y="0" width="80" height="56"
        fill="url(#shine)" clip-path="inset(0 round 12px)"/>

  <!-- Text -->
  <text x="130" y="35" text-anchor="middle"
        font-family="Inter, -apple-system, sans-serif"
        font-size="15" font-weight="600"
        fill="#ffffff" letter-spacing="0.5">
    ✦ Check my Portfolio ✦
  </text>
</svg>